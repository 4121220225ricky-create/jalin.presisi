const DEFAULT_PARAMS={n:12,docs:4,missing:4,reentry:2,response:30,clarify:15,steps:7,precheck:3,jalinReentry:1,jalinResponse:20,reviewBase:7,reviewJalin:10,auditBase:5,auditJalin:7};
function seedCase(row,i){const [scenario,id,title]=row,s=SCENARIOS[scenario];return {id,scenario,title,category:s.category,location:s.location,started:false,status:'NEW',owner:'djbc',docs:{notice:true,summary:true,inventory:true,attachment:!s.missing||i===3},checklistViewed:false,legalRequired:s.legal,legalReviewed:false,legalChecks:[false,false,false],pending:false,network:s.network,queued:false,sent:false,received:false,followed:false,closed:false,firstSubmission:null,minute:0,sendMinute:null,receiveMinute:null,events:[{seq:1,minute:0,role:'system',action:'seed',title:'Skenario fiktif disiapkan',detail:'Kondisi awal demo; belum ada tindakan pengguna.',before:'NEW',after:'NEW',kind:'info'}]};}
function initialState(){return {schema:1,version:VERSION,role:'djbc',activeCase:'DEM-JP-001',cases:SEEDS.map(seedCase),params:{...DEFAULT_PARAMS}};}
let storageAvailable=true;
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s?.schema===1 && s.version===VERSION && Array.isArray(s.cases) && s.cases.length===SEEDS.length && s.cases.every((c,i)=>c.id===SEEDS[i][1] && SCENARIOS[c.scenario] && STATUS[c.status] && ROLES[c.owner] && c.docs && DOCUMENTS.every(d=>typeof c.docs[d.id]==='boolean') && Array.isArray(c.events) && Array.isArray(c.legalChecks)) && ROLES[s.role] && s.cases.some(c=>c.id===s.activeCase) && Object.keys(DEFAULT_PARAMS).every(k=>Number.isFinite(s.params?.[k])))return s;}catch(e){storageAvailable=false;}return initialState();}
let state=loadState();let ui={module:'overview',pillar:0,deskTab:'summary',filters:{query:'',status:'all',scenario:'all',owner:'all'},gov:'sources',sourceFilter:'all',notice:null};
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageAvailable=true;}catch(e){storageAvailable=false;}}
function activeCase(){return state.cases.find(c=>c.id===state.activeCase)||state.cases[0];}
function complete(c){return DOCUMENTS.every(d=>c.docs[d.id]);}
function docCount(c){return DOCUMENTS.filter(d=>c.docs[d.id]).length;}
function statusPill(c){const [name,color]=STATUS[c.status];return `<span class="pill ${color}"><span class="dot"></span>${name}</span>`;}
function actionButton(action,label,primary=false){return `<button class="btn ${primary?'primary':''}" data-action="${action}">${icon({start:'arrow',check:'check',submit:'send',receive:'check',clarify:'warning',followup:'file',finish:'check',review:'policy',sync:'network',observe:'audit',escalate:'warning'}[action]||'file')}${label}</button>`;}
function sourceLink(id,label){const s=SOURCES.find(x=>x.id===id);return `<a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(label||s.institution+' · '+s.year)} ${icon('external')}</a>`;}
function toast(message,warn=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast visible'+(warn?' warn':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),5500);}
function pushEvent(c,action,title,detail,minutes=1,kind='ok',before=c.status){c.minute+=minutes;c.events.push({seq:c.events.length+1,minute:c.minute,role:state.role,action,title,detail,before,after:c.status,kind});}
function deriveStatus(c){if(c.closed)return 'CLOSED';if(c.followed)return 'FOLLOWUP';if(c.received)return 'RECEIVED';if(c.queued)return 'QUEUE';if(c.sent)return 'SENT';if(c.legalRequired&&!c.legalReviewed)return 'LEGAL';if(c.pending||!complete(c))return 'CLARIFY';if(c.checklistViewed)return 'READY';return c.started?'CHECK':'NEW';}
function permitted(action,role){return ({start:['djbc','polri','legal','audit'],check:['djbc','polri'],submit:['djbc'],receive:['polri'],clarify:['polri'],followup:['polri'],finish:['polri'],review:['legal'],sync:['djbc'],observe:['audit'],escalate:['djbc','polri'],complete:['djbc']})[action]?.includes(role);}
function execute(action,docId){const c=activeCase(),before=c.status;let message='';
 const block=(reason)=>{pushEvent(c,action,'Tindakan belum dapat dilanjutkan',reason,1,'blocked',before);save();render();toast(reason,true);return false;};
 if(!permitted(action,state.role))return block('Peran '+ROLES[state.role].short+' tidak menjalankan tindakan ini dalam simulasi.');
 if(action==='start'){if(c.started)return toast('Skenario sudah dimulai. Gunakan tindakan yang tersedia.');c.started=true;c.status='CHECK';message='Simulasi dimulai. Periksa checklist untuk membaca kebutuhan skenario.';pushEvent(c,action,'Simulasi dimulai',message,0,'ok',before);}
 else{if(!c.started)return block('Mulai simulasi terlebih dahulu.');if(c.closed)return block('Simulasi selesai. Reset kasus untuk mencoba jalur lain.');
  if(action==='check'){c.checklistViewed=true;c.status=deriveStatus(c);if(c.legalRequired&&!c.legalReviewed)c.owner='legal';message=complete(c)?'Seluruh dokumen demo tersedia. '+(c.legalRequired&&!c.legalReviewed?'Telaah manusia masih diperlukan.':'Paket siap untuk pengiriman administratif.'):'Ada '+(4-docCount(c))+' dokumen demo yang belum tersedia. Pemilik tugas: Pengawasan DJBC.';pushEvent(c,action,'Checklist diperiksa',message,3,'ok',before);}
  else if(action==='complete'){if(!DOCUMENTS.some(d=>d.id===docId))return block('Dokumen tidak dikenal.');if(c.docs[docId])return toast('Dokumen ini sudah tersedia.');if(c.sent||c.received)return block('Paket sudah dikirim. Koreksi memerlukan permintaan klarifikasi dari penerima.');c.docs[docId]=true;c.pending=!complete(c);c.owner='djbc';c.status=deriveStatus(c);message='Dokumen fiktif dilengkapi oleh pengirim. Periksa ulang paket sebelum pengiriman.';pushEvent(c,action,'Dokumen sintetis dilengkapi',DOCUMENTS.find(d=>d.id===docId).name+'. '+message,8,'ok',before);}
  else if(action==='review'){if(!c.legalRequired)return block('Skenario ini tidak meminta telaah tambahan.');if(c.legalReviewed)return toast('Telaah skenario sudah tercatat.');if(!c.legalChecks.every(Boolean))return block('Lengkapi tiga butir telaah skenario sebelum mencatat hasil.');c.legalReviewed=true;c.owner='djbc';c.status=deriveStatus(c);message='Telaah skenario tercatat. Tindak lanjut dirujuk kepada pejabat berwenang; tidak ada izin tindakan paksa yang diterbitkan.';pushEvent(c,action,'Hasil telaah skenario dicatat',message,12,'ok',before);}
  else if(action==='submit'){if(c.sent||c.queued||c.received)return block('Paket sudah dikirim atau berada dalam antrean.');if(!c.checklistViewed)return block('Periksa checklist sebelum mengirim paket.');if(c.legalRequired&&!c.legalReviewed){c.status='LEGAL';c.owner='legal';return block('Memerlukan telaah hukum oleh manusia. Sistem tidak menetapkan kewenangan tindakan.');}if(c.firstSubmission===null)c.firstSubmission={complete:complete(c),minute:c.minute,docs:docCount(c)};if(!complete(c)){c.pending=true;c.owner='djbc';c.status='CLARIFY';message='Pengajuan belum lengkap: tidak dikirim sebagai serah terima lengkap. Lengkapi lampiran atau koordinasikan kebutuhan klarifikasi.';pushEvent(c,action,'Pengajuan pertama belum lengkap',message,2,'blocked',before);save();render();toast(message,true);return false;}if(c.network==='limited'){c.queued=true;c.status='QUEUE';message='Paket fiktif masuk antrean lokal demo. Pulihkan koneksi skenario, kemudian sinkronkan.';pushEvent(c,action,'Paket masuk antrean demo',message,2,'ok',before);}else{c.sent=true;c.pending=false;c.owner='polri';c.sendMinute=c.minute+2;c.status='SENT';message='Pengiriman administratif tercatat. Ganti peran ke Koordinasi Polri untuk memeriksa penerimaan.';pushEvent(c,action,'Paket koordinasi dikirim',message,2,'ok',before);}}
  else if(action==='sync'){if(!c.queued)return block('Tidak ada paket di antrean demo.');if(c.network==='limited')return block('Pulihkan koneksi skenario sebelum sinkronisasi.');c.queued=false;c.sent=true;c.pending=false;c.owner='polri';c.sendMinute=c.minute+2;c.status='SENT';message='Catatan administratif disinkronkan dalam demo. Tidak mengesahkan tindakan hukum sebelumnya.';pushEvent(c,action,'Antrean demo disinkronkan',message,2,'ok',before);}
  else if(action==='receive'){if(!c.sent)return block('Paket belum dikirim oleh Pengawasan DJBC.');if(c.received)return toast('Penerimaan sudah tercatat.');if(!complete(c)||c.legalRequired&&!c.legalReviewed)return block('Kelengkapan atau telaah skenario belum terpenuhi.');c.received=true;c.pending=false;c.owner='polri';c.receiveMinute=c.minute+5;c.status='RECEIVED';message='Penerimaan administratif tercatat. Tetapkan catatan tindak lanjut untuk menjaga kesinambungan.';pushEvent(c,action,'Penerimaan paket dicatat',message,5,'ok',before);}
  else if(action==='clarify'){if(!c.sent&&!c.pending)return block('Belum ada pengajuan yang memerlukan klarifikasi.');if(c.received||c.followed)return block('Tahap penerimaan sudah selesai. Mulai ulang kasus untuk menguji klarifikasi sebelum penerimaan.');c.pending=true;c.sent=false;c.queued=false;c.docs.attachment=false;c.owner='djbc';c.status='CLARIFY';message='Penerima meminta revisi lampiran fiktif. Tugas kembali kepada Pengawasan DJBC; catatan lama tetap tersedia.';pushEvent(c,action,'Klarifikasi dokumen diminta',message,4,'ok',before);}
  else if(action==='followup'){if(!c.received)return block('Catat penerimaan sebelum tindak lanjut.');if(c.followed)return toast('Tindak lanjut sudah tercatat.');c.followed=true;c.owner='polri';c.status='FOLLOWUP';message='Penanggung jawab tindak lanjut: Koordinasi Polri. Tindakan berikutnya ditentukan pejabat berwenang melalui prosedur resmi.';pushEvent(c,action,'Tindak lanjut administratif dicatat',message,6,'ok',before);}
  else if(action==='finish'){if(!c.followed)return block('Catat tindak lanjut sebelum mengakhiri skenario.');c.closed=true;c.status='CLOSED';message='Simulasi selesai. Laporan berisi proses administratif demo, bukan hasil perkara nyata.';pushEvent(c,action,'Simulasi diakhiri',message,0,'ok',before);}
  else if(action==='observe'){message='Observasi pengawas: '+(c.pending?'klarifikasi masih menunggu Pengawasan DJBC.':c.legalRequired&&!c.legalReviewed?'telaah skenario belum tercatat.':'riwayat administratif tersedia untuk diperiksa.');pushEvent(c,action,'Observasi pengawasan dicatat',message,2,'ok',before);}
  else if(action==='escalate'){message='Kebutuhan koordinasi diteruskan kepada penghubung/pimpinan sesuai protokol usulan. Status pokok tidak disahkan oleh eskalasi.';pushEvent(c,action,'Kebutuhan eskalasi dicatat',message,3,'ok',before);}
 }
 save();render();toast(message);return true;
}

/* Deterministic batch model. Shared demand: n cases, d documents and m incomplete first packets.

function computeLab(p){const n=p.n,d=p.docs,m=Math.min(p.missing,n),corrected=Math.min(m,p.precheck),mb=m,mj=m-corrected;const make=(kind,miss,reentry,response,review,audit)=>{const records=Array.from({length:n},(_,i)=>({id:'SYN-'+String(i+1).padStart(2,'0'),model:kind,documentsRequired:d,completeFirst:i>=miss,documentsFirst:i>=miss?d:d-1,clarificationRequired:i<miss,reentryCount:reentry,responseMinutes:response+(i<miss?p.clarify:0),reviewChecked:i<Math.min(review,n),auditExpected:p.steps,auditRecorded:Math.min(audit,p.steps),pendingClarification:i<miss}));return {records,firstPass:records.filter(r=>r.completeFirst).length/n*100,reentry:records.reduce((t,r)=>t+r.reentryCount,0),response:records.reduce((t,r)=>t+r.responseMinutes,0)/n,review:records.filter(r=>r.reviewChecked).length/n*100,audit:records.reduce((t,r)=>t+r.auditRecorded,0)/(n*p.steps)*100,pending:records.filter(r=>r.pendingClarification).length};};return {inputs:{...p,missing: m,precheck:corrected},baseline:make('Baseline',mb,p.reentry,p.response,p.reviewBase,p.auditBase),jalin:make('JALIN',mj,p.jalinReentry,p.jalinResponse,p.reviewJalin,p.auditJalin)};}
const METRICS=[{id:'firstPass',name:'Kelengkapan pengajuan pertama',english:'First-Pass Document Completeness',unit:'%',better:'higher',formula:'pengajuan lengkap pada pemeriksaan pertama / seluruh pengajuan × 100',interpret:'Persentase paket yang memenuhi semua dokumen skenario pada pengajuan pertama.'},{id:'reentry',name:'Pencatatan ulang administratif',english:'Administrative Re-entry Count',unit:'entri',better:'lower',formula:'Σ jumlah pencatatan ulang tiap kasus',interpret:'Jumlah kegiatan memasukkan kembali informasi yang sama dalam model.'},{id:'response',name:'Waktu respons serah terima',english:'Handover Response Time',unit:'menit',better:'lower',formula:'Σ [waktu respons awal + tambahan klarifikasi] / jumlah kasus',interpret:'Rerata waktu sintetis model. Tambahan waktu dikenakan untuk paket yang perlu klarifikasi.'},{id:'review',name:'Cakupan pemeriksaan prosedural',english:'Procedural Review Coverage',unit:'%',better:'higher',formula:'kasus dengan pemeriksaan tercatat / seluruh kasus × 100',interpret:'Ketercakupan pemeriksaan, bukan ukuran sahnya tindakan.'},{id:'audit',name:'Kelengkapan jejak audit',english:'Audit Trail Completeness',unit:'%',better:'higher',formula:'Σ aktivitas tercatat / Σ aktivitas yang diharapkan × 100',interpret:'Ketersediaan catatan aktivitas pada skenario, bukan jaminan integritas produksi.'},{id:'pending',name:'Klarifikasi tertunda',english:'Pending Clarification Count',unit:'kasus',better:'lower',formula:'Σ kasus belum lengkap pada snapshot pengajuan pertama',interpret:'Snapshot awal setelah pengajuan; bukan jumlah kasus yang akhirnya tidak diselesaikan.'}];
function paramField(id,label,min,max,unit,help){const p=state.params;return `<div class="param-field"><div class="param-top"><label for="param-${id}">${label}</label><b id="output-${id}">${num(p[id],0)}<span style="font-size:9px;font-weight:400"> ${unit}</span></b></div><input type="range" id="param-${id}" data-param="${id}" min="${min}" max="${max}" step="1" value="${p[id]}"><div class="range-labels"><span>${min}</span><span>${max}</span></div>${help?`<p class="param-explainer">${help}</p>`:''}</div>`;}
function metricChart(result){return METRICS.map(m=>{const b=result.baseline[m.id],j=result.jalin[m.id],max=m.unit==='%'?100:Math.max(b,j,1);return `<div class="metric-pair"><h3>${m.name}<small>${m.better==='higher'?'Lebih tinggi diharapkan':'Lebih rendah diharapkan'}</small></h3><div class="bar-row"><span>Baseline</span><div class="bar-track"><span style="width:${Math.max(0,b/max*100)}%"></span></div><span class="value">${num(b)} ${m.unit}</span></div><div class="bar-row jalin"><span>JALIN</span><div class="bar-track"><span style="width:${Math.max(0,j/max*100)}%"></span></div><span class="value">${num(j)} ${m.unit}</span></div></div>`;}).join('');}
function compareConclusion(r){const n=METRICS.filter(m=>m.better==='higher'?r.jalin[m.id]>r.baseline[m.id]:r.jalin[m.id]<r.baseline[m.id]).length;return `${n} dari 6 indikator bergerak ke arah yang diharapkan pada asumsi saat ini. Hasil dapat setara atau memburuk ketika parameter JALIN diubah; ini bukan estimasi dampak lapangan.`;}
function liveMetrics(){const started=state.cases.filter(c=>c.started),submitted=started.filter(c=>c.firstSubmission!==null),receipts=started.filter(c=>c.received),response=receipts.length?receipts.reduce((s,c)=>s+c.receiveMinute-c.sendMinute,0)/receipts.length:null;return {started:started.length,submitted:submitted.length,firstPass:submitted.length?submitted.filter(c=>c.firstSubmission.complete).length/submitted.length*100:null,pending:started.filter(c=>c.pending).length,response,activities:started.reduce((s,c)=>s+c.events.length-1,0)};}
function policyLab(){const p=state.params,r=computeLab(p),live=liveMetrics();return pageHeading('04 / POLICY & IMPACT LAB','Ubah asumsi. Periksa hasilnya.','Bandingkan dua rancangan proses dengan beban kasus yang sama. Semua nilai batch berasal dari parameter sintetis.',`<button class="btn" data-command="reset-params">${icon('reset')}Reset parameter</button><button class="btn" data-command="export-lab-csv">${icon('download')}CSV</button><button class="btn" data-command="export-lab-json">JSON</button>`)+`<div class="note amber" style="margin-bottom:20px">Baseline adalah asumsi model pembanding, bukan hasil audit Polri/DJBC. Parameter JALIN juga merupakan asumsi; kepercayaan publik dan biaya sosial tidak dihitung oleh model ini.</div><div class="lab-layout"><aside class="panel"><div class="panel-head"><div><h3>Parameter simulasi</h3><p>Nilai dapat diubah dan direproduksi.</p></div></div><div class="panel-pad"><div class="eyebrow muted" style="margin-bottom:18px">BEBAN KASUS BERSAMA</div><div class="params-grid">${paramField('n','Jumlah kasus',1,30,'kasus')}${paramField('docs','Dokumen wajib per kasus',2,8,'dok.')}${paramField('missing','Paket awal belum lengkap',0,p.n,'kasus','Satu dokumen tidak tersedia pada tiap paket ini.')}${paramField('clarify','Tambahan waktu klarifikasi',0,60,'menit')}${paramField('steps','Aktivitas yang diharapkan',4,12,'tahap')}</div><div class="param-legend"><span class="swatch"></span><b>Asumsi Baseline</b></div><div class="params-grid">${paramField('reentry','Pencatatan ulang per kasus',0,5,'entri')}${paramField('response','Respons awal',1,90,'menit')}${paramField('reviewBase','Kasus diperiksa',0,p.n,'kasus')}${paramField('auditBase','Catatan per kasus',0,p.steps,'tahap')}</div><div class="param-legend section"><span class="swatch jalin"></span><b>Asumsi JALIN</b></div><div class="params-grid">${paramField('precheck','Paket diperbaiki sebelum kirim',0,Math.min(p.missing,p.n),'kasus','Asumsi pemeriksaan awal; bukan tingkat efektivitas terukur.')}${paramField('jalinReentry','Pencatatan ulang per kasus',0,5,'entri')}${paramField('jalinResponse','Respons awal',1,90,'menit')}${paramField('reviewJalin','Kasus diperiksa',0,p.n,'kasus')}${paramField('auditJalin','Catatan per kasus',0,p.steps,'tahap')}</div></div></aside><div class="stack"><section class="panel"><div class="panel-head"><div><h2>Perbandingan proses</h2><p id="labSummary">${p.n} kasus · ${p.docs} dokumen wajib · snapshot pengajuan pertama</p></div><div class="flex wrap" style="font-size:9px"><span class="flex"><i class="swatch"></i>Baseline</span><span class="flex"><i class="swatch jalin"></i>JALIN</span></div></div><div id="metricChart">${metricChart(r)}</div><div class="compare-callout" id="compareConclusion">${compareConclusion(r)}</div></section><section class="panel"><div class="panel-head"><div><h2>Hasil sesi CaseLab Anda</h2><p>State interaksi aktual pada perangkat ini · terpisah dari model batch di atas</p></div></div><div class="panel-pad"><div class="live-eval"><div><b>${live.firstPass===null?'—':num(live.firstPass)+'%'}</b><p>Pengajuan pertama lengkap</p><small>${live.submitted} kasus diajukan</small></div><div><b>${live.pending}</b><p>Klarifikasi tertunda</p><small>${live.started} simulasi dimulai</small></div><div><b>${live.response===null?'—':num(live.response)}</b><p>Rerata respons (menit)</p><small>${state.cases.filter(c=>c.received).length} penerimaan</small></div></div><p class="muted" style="font-size:10px;margin-top:14px">Tanda — berarti belum ada pengamatan yang sesuai. Ekspor JSON menyertakan data batch dan ringkasan sesi CaseLab tanpa mencampur keduanya.</p></div></section></div></div>
 <section class="panel section"><div class="panel-head"><div><h2>Rumus, input, dan batas interpretasi</h2><p>Grafik dapat direproduksi dari baris data sintetis pada ekspor.</p></div></div><div class="table-wrap"><table><thead><tr><th>Indikator</th><th>Rumus & satuan</th><th>Input dan interpretasi</th></tr></thead><tbody>${METRICS.map(m=>`<tr><td><strong>${m.name}</strong><p class="muted">${m.english}</p></td><td><div class="formula">${m.formula}</div><span class="muted">Satuan: ${m.unit}</span></td><td>${m.interpret}</td></tr>`).join('')}</tbody></table></div></section><details class="method-details"><summary>Bagaimana model menghasilkan setiap baris data?</summary><div><p>Kasus diberi ID SYN-01 hingga SYN-N tanpa pengacakan. Pada Baseline, M kasus pertama kehilangan satu dari D dokumen. Pada JALIN, C paket dari kelompok yang sama diperbaiki sebelum pengajuan sehingga tersisa M−C kasus belum lengkap. Kasus, kebutuhan dokumen, serta tambahan waktu klarifikasi sama pada kedua model.</p><div class="formula">Kelengkapan Baseline = (N−M)/N × 100<br>Kelengkapan JALIN = [N−(M−C)]/N × 100<br>Respons = R + (kasus perlu klarifikasi / N) × K</div><p>Waktu respons dihitung sejak pengajuan; durasi pemeriksaan dan perbaikan sebelum kirim tidak masuk metrik ini. Model tidak menghitung total durasi penanganan. Respons awal, pencatatan ulang, jumlah kasus diperiksa, dan aktivitas tercatat ditentukan pengguna untuk masing-masing model. Hasil tidak menjamin JALIN lebih baik. Untuk mengisolasi efek satu asumsi, samakan parameter lain. Semua input ditampilkan dan diekspor; batas parameter mencegah persentase di luar 0–100%.</p></div></details><div class="grid-2 section"><div class="note"><b>Manfaat proses yang bisa diuji</b><br>Kelengkapan paket, respons koordinasi, pekerjaan berulang, dan keterlacakan penanggung jawab memerlukan baseline operasional yang dikumpulkan secara sah.</div><div class="note"><b>Dampak kebijakan yang perlu pengukuran terpisah</b><br>Kepercayaan publik serta pengurangan biaya sosial narkotika memerlukan desain evaluasi dan data tambahan setelah penerapan.</div></div>`;}
function renderLabOutputs(){const r=computeLab(state.params);document.getElementById('metricChart').innerHTML=metricChart(r);document.getElementById('compareConclusion').textContent=compareConclusion(r);document.getElementById('labSummary').textContent=`${state.params.n} kasus · ${state.params.docs} dokumen wajib · snapshot pengajuan pertama`;for(const [id,v]of Object.entries(state.params)){const inp=document.getElementById('param-'+id),out=document.getElementById('output-'+id);if(inp){inp.value=v;if(['missing','reviewBase','reviewJalin'].includes(id))inp.max=state.params.n;if(id==='precheck')inp.max=Math.min(state.params.missing,state.params.n);if(['auditBase','auditJalin'].includes(id))inp.max=state.params.steps;}if(out)out.firstChild.textContent=num(v,0);if(inp){const labels=inp.parentElement.querySelector('.range-labels');if(labels)labels.lastElementChild.textContent=inp.max;}}}
function setParam(id,value){if(!(id in DEFAULT_PARAMS))return;const p=state.params;const bounds={n:[1,30],docs:[2,8],missing:[0,p.n],reentry:[0,5],response:[1,90],clarify:[0,60],steps:[4,12],precheck:[0,Math.min(p.missing,p.n)],jalinReentry:[0,5],jalinResponse:[1,90],reviewBase:[0,p.n],reviewJalin:[0,p.n],auditBase:[0,p.steps],auditJalin:[0,p.steps]};const [min,max]=bounds[id];p[id]=Math.min(max,Math.max(min,Math.round(Number(value)||min)));p.missing=Math.min(p.missing,p.n);p.precheck=Math.min(p.precheck,p.missing);p.reviewBase=Math.min(p.reviewBase,p.n);p.reviewJalin=Math.min(p.reviewJalin,p.n);p.auditBase=Math.min(p.auditBase,p.steps);p.auditJalin=Math.min(p.auditJalin,p.steps);save();renderLabOutputs();}

function navigate(id,push=true){if(!MODULES.some(m=>m.id===id))id='overview';ui.module=id;if(push&&location.hash!=='#'+id)history.pushState(null,'','#'+id);closeNav();render();window.scrollTo({top:0,behavior:'instant'});}
function render(){document.getElementById('breadcrumb').textContent=MODULES.find(m=>m.id===ui.module)?.name||'Ringkasan';document.getElementById('nav').innerHTML=MODULES.map((m,i)=>`<button class="nav-btn ${ui.module===m.id?'active':''}" data-nav="${m.id}" ${ui.module===m.id?'aria-current="page"':''}>${icon(m.icon)}<span>${m.name}</span><span class="num">0${i+1}</span></button>`).join('');document.getElementById('main').innerHTML=`<div class="print-report">JALIN PRESISI — Prototipe Riset Independen · Data fiktif · Bukan Sistem Resmi Polri/DJBC</div>`+({overview,policy,case:caseLab,desk:jointDesk,lab:policyLab,governance}[ui.module]||overview)()+(!storageAvailable?'<div class="note amber section">Penyimpanan lokal tidak tersedia. Simulasi tetap berjalan pada sesi ini; ekspor laporan sebelum menutup halaman.</div>':'')+footer();}
function closeNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('veil').classList.remove('open');document.getElementById('navOpen').setAttribute('aria-expanded','false');}
function modal(body,actions){document.getElementById('dialogBody').innerHTML=body;document.getElementById('dialogActions').innerHTML=actions;document.getElementById('modal').showModal();}
function confirmReset(scope){const text=scope==='all'?'Seluruh kasus, riwayat, peran, dan parameter kembali ke kondisi awal.':`Kasus ${activeCase().id} dan riwayatnya kembali ke kondisi awal; kasus lain tetap tersedia.`;modal(`<h2>Mulai ulang demo?</h2><p>${text}</p><p>Ekspor laporan lebih dahulu jika hasil simulasi ingin disimpan.</p>`,`<button class="btn" data-command="close-modal">Batal</button><button class="btn danger" data-command="confirm-reset-${scope}">Ya, reset ${scope==='all'?'seluruh demo':'kasus'}</button>`);}
function download(name,data,type='application/json'){const text=typeof data==='string'?data:JSON.stringify(data,null,2),blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Laporan '+name+' disiapkan dari data yang tampil.');}
function caseReport(c){return {product:'JALIN PRESISI',version:VERSION,dataType:'SYNTHETIC',timeBasis:'T+menit sintetis; bukan waktu kejadian nyata',legalLimit:'Catatan administrasi demo; tidak menerbitkan keputusan hukum.',scenarioMaster:SCENARIOS[c.scenario],case:structuredClone(c),summary:{documentsAvailable:docCount(c),documentsRequired:4,totalSyntheticMinutes:c.minute,firstSubmission:c.firstSubmission,blockedActions:c.events.filter(e=>e.kind==='blocked').length,received:c.received,followed:c.followed,completed:c.closed}};}
function labReport(){return {product:'JALIN PRESISI',version:VERSION,dataType:'SYNTHETIC',model:'deterministic-batch-v1',interpretation:'Perbandingan asumsi proses, bukan dampak operasional empiris.',...computeLab(state.params),metricDefinitions:METRICS,caseLabSession:liveMetrics()};}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"';}
function labCSV(){const r=computeLab(state.params),headers=['model','id','documentsRequired','documentsFirst','completeFirst','clarificationRequired','reentryCount','responseMinutes','reviewChecked','auditExpected','auditRecorded','pendingClarification'];return '\ufeff'+[headers.map(csvCell).join(','),...[...r.baseline.records,...r.jalin.records].map(row=>headers.map(k=>csvCell(row[k])).join(','))].join('\r\n');}
function command(id){const dialog=document.getElementById('modal');if(id==='help')modal(`<div class="eyebrow" style="color:var(--blue);margin-bottom:10px">PANDUAN DEMONSTRASI / 3 MENIT</div><h2>Ikuti satu paket informasi.</h2><ol><li>Buka CaseLab, pilih skenario A, lalu <b>Mulai simulasi</b>.</li><li>Periksa checklist dan coba kirim saat lampiran belum lengkap. Baca feedback dan timeline.</li><li>Lengkapi dokumen demo, kirim, lalu ganti peran ke <b>Koordinasi Polri</b>.</li><li>Catat penerimaan, tindak lanjut, dan akhiri simulasi. Periksa kasus yang sama di Ruang Koordinasi.</li><li>Buka Policy Lab, ubah parameter, lalu periksa rumus dan ekspor data.</li></ol><p>Skenario B meminta telaah manusia; skenario C memperagakan antrean saat koneksi dibatasi. Semua peran, dokumen, dan waktu bersifat fiktif.</p>`,`<button class="btn" data-command="close-modal">Tutup</button><button class="btn primary" data-command="help-start">Buka CaseLab ${icon('arrow')}</button>`);
 else if(id==='help-start'){dialog.close();navigate('case');}else if(id==='close-modal')dialog.close();else if(id==='reset-all')confirmReset('all');else if(id==='reset-case')confirmReset('case');else if(id==='confirm-reset-all'){state=initialState();ui.filters={query:'',status:'all',scenario:'all',owner:'all'};dialog.close();save();render();toast('Seluruh data demo dan parameter telah dikembalikan ke kondisi awal.');}else if(id==='confirm-reset-case'){const i=state.cases.findIndex(c=>c.id===state.activeCase);state.cases[i]=seedCase(SEEDS[i],i);dialog.close();save();render();toast('Kasus aktif direset. Riwayat kasus lain tetap tersedia.');}else if(id==='reset-params'){state.params={...DEFAULT_PARAMS};save();render();toast('Parameter batch kembali ke asumsi awal.');}else if(id==='reset-filters'){ui.filters={query:'',status:'all',scenario:'all',owner:'all'};render();toast('Filter daftar kasus direset.');}else if(id==='export-case')download('JALIN-'+activeCase().id+'.json',caseReport(activeCase()));else if(id==='export-all')download('JALIN-demo-cases.json',{product:'JALIN PRESISI',dataType:'SYNTHETIC',version:VERSION,cases:state.cases.map(caseReport)});else if(id==='export-lab-json')download('JALIN-policy-lab.json',labReport());else if(id==='export-lab-csv')download('JALIN-policy-lab.csv',labCSV(),'text/csv;charset=utf-8');else if(id==='export-sources')download('JALIN-source-register.json',{checkedAt:'2026-10-14 Asia/Jakarta',sources:SOURCES});else if(id==='print')window.print();}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-case]');if(!el||el.disabled)return;if(el.dataset.command)return command(el.dataset.command);if(el.dataset.action)return execute(el.dataset.action,el.dataset.doc);if(el.dataset.caseSelect){state.activeCase=el.dataset.caseSelect;save();}if(el.dataset.pillar!==undefined){ui.pillar=Number(el.dataset.pillar);if(!el.dataset.nav){render();return;}}if(el.dataset.nav)return navigate(el.dataset.nav);if(el.dataset.caseSelect)return selectCase(el.dataset.caseSelect);if(el.dataset.case)return selectCase(el.dataset.case);if(el.dataset.deskTab){ui.deskTab=el.dataset.deskTab;render();return;}if(el.dataset.gov){ui.gov=el.dataset.gov;render();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.control==='role')return changeRole(el.value);if(el.dataset.control==='case')return selectCase(el.value);if(el.dataset.control==='network')return switchNetwork(el.value);if(el.dataset.legalCheck!==undefined){const c=activeCase();if(state.role!=='legal'||!c.started||c.closed||c.legalReviewed)return;const i=Number(el.dataset.legalCheck);if(i<0||i>2)return;c.legalChecks[i]=el.checked;pushEvent(c,'legal-check','Butir telaah skenario diperbarui','Butir '+(i+1)+': '+(el.checked?'ditandai telah ditinjau.':'ditandai perlu ditinjau kembali.'),1,'info');save();render();return;}if(el.dataset.control==='sourceFilter'){ui.sourceFilter=el.value;document.getElementById('sourceRows').innerHTML=referenceRows(el.value);}if(el.dataset.filter){ui.filters[el.dataset.filter]=el.value;document.getElementById('deskRows').innerHTML=deskRows();document.getElementById('filterCount').textContent=filteredCases().length+' dari '+state.cases.length+' kasus';}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.param)return setParam(el.dataset.param,el.value);if(el.dataset.filter==='query'){ui.filters.query=el.value;document.getElementById('deskRows').innerHTML=deskRows();document.getElementById('filterCount').textContent=filteredCases().length+' dari '+state.cases.length+' kasus';}});
document.getElementById('navOpen').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('veil').classList.add('open');document.getElementById('navOpen').setAttribute('aria-expanded','true');});document.getElementById('navClose').addEventListener('click',closeNav);document.getElementById('veil').addEventListener('click',closeNav);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});window.addEventListener('popstate',()=>navigate(location.hash.slice(1),false));window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==ui.module)navigate(location.hash.slice(1),false);});
// Exported pure model supports reproducible QA without importing any government data.
window.JalinModel={computeLab,definitions:METRICS,defaultParams:{...DEFAULT_PARAMS},version:VERSION};
navigate(location.hash.slice(1)||'overview',false);
</script>
</body>
