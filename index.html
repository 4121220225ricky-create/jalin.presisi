const DEFAULT_PARAMS={n:12,docs:4,missing:4,reentry:2,response:30,clarify:15,steps:7,precheck:3,jalinReentry:1,jalinResponse:20,reviewBase:7,reviewJalin:10,auditBase:5,auditJalin:7};
function seedCase(row,i){const [scenario,id,title]=row,s=SCENARIOS[scenario];return {id,scenario,title,category:s.category,location:s.location,started:false,status:'NEW',owner:'djbc',docs:{notice:true,summary:true,inventory:true,attachment:!s.missing||i===3},checklistViewed:false,legalRequired:s.legal,legalReviewed:false,legalChecks:[false,false,false],pending:false,network:s.network,queued:false,sent:false,received:false,followed:false,closed:false,firstSubmission:null,minute:0,sendMinute:null,receiveMinute:null,events:[{seq:1,minute:0,role:'system',action:'seed',title:'Skenario fiktif disiapkan',detail:'Kondisi awal demo; belum ada tindakan pengguna.',before:'NEW',after:'NEW',kind:'info'}]};}
function initialState(){return {schema:1,version:VERSION,role:'djbc',activeCase:'DEM-JP-001',cases:SEEDS.map(seedCase),params:{...DEFAULT_PARAMS}};}
let storageAvailable=true;
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s?.schema===1 && [VERSION,'1.0.0','2.0.0','3.0.0'].includes(s.version) && Array.isArray(s.cases) && s.cases.length===SEEDS.length && s.cases.every((c,i)=>c.id===SEEDS[i][1] && SCENARIOS[c.scenario] && STATUS[c.status] && ROLES[c.owner] && c.docs && DOCUMENTS.every(d=>typeof c.docs[d.id]==='boolean') && Array.isArray(c.events) && Array.isArray(c.legalChecks)) && ROLES[s.role] && s.cases.some(c=>c.id===s.activeCase) && Object.keys(DEFAULT_PARAMS).every(k=>Number.isFinite(s.params?.[k])))return {...s,version:VERSION};}catch(e){storageAvailable=false;}return initialState();}
let state=loadState();let ui={module:'overview',pillar:0,deskTab:'summary',filters:{query:'',status:'all',scenario:'all',owner:'all'},gov:'sources',sourceFilter:'all',scene:'handover',board:true,packetTab:'summary',actionPopups:true,modalKind:null,notice:null};
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageAvailable=true;}catch(e){storageAvailable=false;}}
function activeCase(){return state.cases.find(c=>c.id===state.activeCase)||state.cases[0];}
function complete(c){return DOCUMENTS.every(d=>c.docs[d.id]);}
function docCount(c){return DOCUMENTS.filter(d=>c.docs[d.id]).length;}
function statusPill(c){const [name,color]=STATUS[c.status];return `<span class="pill ${color}"><span class="dot"></span>${name}</span>`;}
function actionButton(action,label,primary=false){return `<button class="btn ${primary?'primary':''}" data-action="${action}">${icon({start:'arrow',check:'check',submit:'send',receive:'check',clarify:'warning',followup:'file',finish:'check',review:'policy',sync:'network',observe:'audit',escalate:'warning'}[action]||'file')}${label}</button>`;}
function sourceLink(id,label){const s=SOURCES.find(x=>x.id===id);return `<a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(label||s.institution+' · '+s.year)} ${icon('external')}</a>`;}
function toast(message,warn=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast visible'+(warn?' warn':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),5500);}
function pushEvent(c,action,title,detail,minutes=1,kind='ok',before=c.status){c.minute+=minutes;c.events.push({seq:c.events.length+1,minute:c.minute,role:state.role,action,title,detail,before,after:c.status,kind});}
function deriveStatus(c){if(c.closed)return 'CLOSED';if(c.followed)return 'FOLLOWUP';if(c.received)return 'RECEIVED';if(c.queued)return 'QUEUE';if(c.sent)return 'SENT';if(c.legalRequired&&!c.legalReviewed)return 'LEGAL';if(c.pending||!complete(c))return 'CLARIFY';if(c.checklistViewed)return 'READY';return c.started?'CHECK':'NEW';}
function permitted(action,role){return ({start:['djbc','polri','legal','audit'],check:['djbc','polri'],submit:['djbc'],receive:['polri'],clarify:['polri'],followup:['polri'],finish:['polri'],review:['legal'],sync:['djbc'],observe:['audit'],escalate:['djbc','polri'],complete:['djbc']})[action]?.includes(role);}
function performAction(action,docId){const c=activeCase(),before=c.status;let message='';
 const block=(reason)=>{pushEvent(c,action,'Tindakan belum dapat dilanjutkan',reason,1,'blocked',before);save();render();toast(reason,true);return false;};
 if(!permitted(action,state.role))return block('Peran '+ROLES[state.role].short+' tidak menjalankan tindakan ini dalam simulasi.');
 if(action==='start'){if(c.started)return toast('Skenario sudah dimulai. Gunakan tindakan yang tersedia.');c.started=true;c.status='CHECK';message='Simulasi dimulai. Periksa checklist untuk membaca kebutuhan skenario.';pushEvent(c,action,'Simulasi dimulai',message,0,'ok',before);}
 else{if(!c.started)return block('Mulai simulasi terlebih dahulu.');if(c.closed)return block('Simulasi selesai. Reset kasus untuk mencoba jalur lain.');
  if(action==='check'){c.checklistViewed=true;c.status=deriveStatus(c);if(c.legalRequired&&!c.legalReviewed)c.owner='legal';message=complete(c)?'Seluruh dokumen demo tersedia. '+(c.legalRequired&&!c.legalReviewed?'Telaah manusia masih diperlukan.':'Paket siap untuk pengiriman administratif.'):'Ada '+(4-docCount(c))+' dokumen demo yang belum tersedia. Pemilik tugas: Pengawasan DJBC.';pushEvent(c,action,'Checklist diperiksa',message,3,'ok',before);}
  else if(action==='complete'){if(!DOCUMENTS.some(d=>d.id===docId))return block('Dokumen tidak dikenal.');if(c.docs[docId])return toast('Dokumen ini sudah tersedia.');if(c.sent||c.received)return block('Paket sudah dikirim. Koreksi memerlukan permintaan klarifikasi dari penerima.');c.docs[docId]=true;c.pending=!complete(c);c.owner='djbc';c.status=deriveStatus(c);message='Dokumen fiktif dilengkapi oleh pengirim. Periksa ulang paket sebelum pengiriman.';pushEvent(c,action,'Dokumen sintetis dilengkapi',DOCUMENTS.find(d=>d.id===docId).name+'. '+message,8,'ok',before);}
  else if(action==='review'){if(!c.legalRequired)return block('Skenario ini tidak meminta telaah tambahan.');if(c.legalReviewed)return toast('Telaah skenario sudah tercatat.');if(!c.legalChecks.every(Boolean))return block('Lengkapi tiga butir telaah skenario sebelum mencatat hasil.');c.legalReviewed=true;c.owner='djbc';c.status=deriveStatus(c);message='Telaah skenario tercatat. Tindak lanjut dirujuk kepada pejabat berwenang; tidak ada izin tindakan paksa yang diterbitkan.';pushEvent(c,action,'Hasil telaah skenario dicatat',message,12,'ok',before);}
  else if(action==='submit'){if(c.sent||c.queued||c.received)return block('Paket sudah dikirim atau berada dalam antrean.');if(!c.checklistViewed)return block('Periksa checklist sebelum mengirim paket.');if(c.legalRequired&&!c.legalReviewed){c.status='LEGAL';c.owner='legal';return block('Memerlukan telaah hukum oleh manusia. Sistem tidak menetapkan kewenangan tindakan.');}if(c.firstSubmission===null)c.firstSubmission={complete:complete(c),minute:c.minute,docs:docCount(c)};if(!complete(c)){c.pending=true;c.owner='djbc';c.status='CLARIFY';message='Pengajuan belum lengkap: tidak dikirim sebagai serah terima lengkap. Lengkapi lampiran atau koordinasikan kebutuhan klarifikasi.';pushEvent(c,action,'Pengajuan pertama belum lengkap',message,2,'blocked',before);save();render();toast(message,true);return false;}if(c.network==='limited'){c.queued=true;c.status='QUEUE';message='Paket fiktif masuk antrean lokal demo. Pulihkan koneksi skenario, kemudian sinkronkan.';pushEvent(c,action,'Paket masuk antrean demo',message,2,'ok',before);}else{c.sent=true;c.pending=false;c.owner='polri';c.sendMinute=c.minute+2;c.status='SENT';message='Pengiriman administratif tercatat. Ganti peran ke Koordinasi Polri untuk memeriksa penerimaan.';pushEvent(c,action,'Paket koordinasi dikirim',message,2,'ok',before);}}
  else if(action==='sync'){if(!c.queued)return block('Tidak ada paket di antrean demo.');if(c.network==='limited')return block('Pulihkan koneksi skenario sebelum sinkronisasi.');c.queued=false;c.sent=true;c.pending=false;c.owner='polri';c.sendMinute=c.minute+2;c.status='SENT';message='Catatan administratif disinkronkan dalam demo. Tidak mengesahkan tindakan hukum sebelumnya.';pushEvent(c,action,'Antrean demo disinkronkan',message,2,'ok',before);}
  else if(action==='receive'){if(!c.sent)return block('Paket belum dikirim oleh Pengawasan DJBC.');if(c.received)return toast('Penerimaan sudah tercatat.');if(!complete(c)||c.legalRequired&&!c.legalReviewed)return block('Kelengkapan atau telaah skenario belum terpenuhi.');c.received=true;c.pending=false;c.owner='polri';c.receiveMinute=c.minute+5;c.status='RECEIVED';message='Penerimaan administratif tercatat. Tetapkan catatan tindak lanjut untuk menjaga kesinambungan.';pushEvent(c,action,'Penerimaan paket dicatat',message,5,'ok',before);}
  else if(action==='clarify'){if(!c.sent&&!c.pending)return block('Belum ada pengajuan yang memerlukan klarifikasi.');if(c.received||c.followed)return block('Tahap penerimaan sudah selesai. Mulai ulang kasus untuk menguji klarifikasi sebelum penerimaan.');c.pending=true;c.sent=false;c.queued=false;c.docs.attachment=false;c.owner='djbc';c.status='CLARIFY';message='Penerima meminta revisi lampiran fiktif. Tugas kembali kepada Pengawasan DJBC; catatan lama tetap tersedia.';pushEvent(c,action,'Klarifikasi dokumen diminta',message,4,'ok',before);}
  else if(action==='followup'){if(!c.received)return block('Catat penerimaan sebelum tindak lanjut.');if(c.followed)return toast('Tindak lanjut sudah tercatat.');c.followed=true;c.owner='polri';c.status='FOLLOWUP';message='Penanggung jawab tindak lanjut: Koordinasi Polri. Tindakan berikutnya ditentukan pejabat berwenang melalui prosedur resmi.';pushEvent(c,action,'Tindak lanjut administratif dicatat',message,6,'ok',before);}
  else if(action==='finish'){if(!c.followed)return block('Catat tindak lanjut sebelum mengakhiri skenario.');c.closed=true;c.status='CLOSED';message='Simulasi selesai. Laporan berisi proses administratif demo, bukan hasil perkara nyata.';pushEvent(c,action,'Simulasi diakhiri',message,0,'ok',before);}
  else if(action==='observe'){message='Observasi pengawas: '+(c.pending?'klarifikasi masih menunggu Pengawasan DJBC.':c.legalRequired&&!c.legalReviewed?'telaah skenario belum tercatat.':'riwayat administratif tersedia untuk diperiksa.');pushEvent(c,action,'Observasi pengawasan dicatat',message,2,'ok',before);}
  else if(action==='escalate'){message='Kebutuhan koordinasi diteruskan kepada penghubung/pimpinan sesuai protokol usulan. Status pokok tidak disahkan oleh eskalasi.';pushEvent(c,action,'Kebutuhan eskalasi dicatat',message,3,'ok',before);}
 }
 save();render();toast(message);return true;
}
function changeRole(role){if(!ROLES[role])return;state.role=role;save();render();toast('Peran simulasi: '+ROLES[role].short+'. '+ROLES[role].task);}
function selectCase(id){if(!state.cases.some(c=>c.id===id))return;state.activeCase=id;ui.deskTab='summary';save();render();}
function switchNetwork(value){const c=activeCase();if(!['online','limited'].includes(value)||c.network===value)return;c.network=value;pushEvent(c,'network','Konektivitas skenario diubah',value==='online'?'Koneksi demo normal. Antrean perlu disinkronkan secara eksplisit.':'Koneksi demo dibatasi; tidak mengubah kondisi jaringan nyata.',0,'info');save();render();toast('Konektivitas skenario: '+(value==='online'?'normal':'terbatas'));}
function roleOptions(){return Object.entries(ROLES).map(([id,r])=>`<option value="${id}" ${id===state.role?'selected':''}>${r.name}</option>`).join('');}
function caseOptions(){return state.cases.map(c=>`<option value="${c.id}" ${c.id===state.activeCase?'selected':''}>${c.id} · ${c.title}</option>`).join('');}
function caseTools(c){return `<div class="panel simulation-bar no-print"><div class="form-row"><div class="form-field"><label for="caseSelect">Skenario & kasus fiktif</label><select id="caseSelect" data-control="case">${caseOptions()}</select></div><div class="form-field"><label for="roleSelect">Peran simulasi</label><select id="roleSelect" data-control="role">${roleOptions()}</select></div><div class="form-field"><label for="networkSelect">Konektivitas skenario</label><select id="networkSelect" data-control="network"><option value="online" ${c.network==='online'?'selected':''}>Normal</option><option value="limited" ${c.network==='limited'?'selected':''}>Terbatas</option></select></div></div><div class="role-note">${icon('user')} Tampilan dan tindakan peran adalah simulasi frontend; bukan autentikasi atau pengendalian keamanan produksi.</div></div>`;}
function pageHeading(eyebrow,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="heading-actions no-print">${actions}</div>`:''}</div>`;}
function footer(){return `<div class="feature-dock no-print" id="featureDock" aria-label="Akses cepat simulasi"></div><footer class="footer"><p>Prototipe Riset Independen. Seluruh Data Perkara Bersifat Simulasi. Bukan Sistem Resmi Polri atau DJBC.</p><span class="footer-version">JALIN PRESISI · 2026 / V${VERSION}</span></footer>`;}
function timeline(c){return c.events.length?`<div class="timeline">${c.events.map(e=>`<div class="event ${e.kind==='blocked'?'blocked':''}"><div class="event-meta"><span>${esc(ROLES[e.role]?.short||'Master skenario')}</span><span class="mono">T+${String(e.minute).padStart(3,'0')} min · #${String(e.seq).padStart(2,'0')}</span></div><div class="event-title">${esc(e.title)}</div><div class="event-detail">${esc(e.detail)}</div><div class="event-status">${STATUS[e.before]?.[0]||esc(e.before)} → ${STATUS[e.after]?.[0]||esc(e.after)}</div></div>`).join('')}</div>`:'<div class="timeline-empty">Belum ada aktivitas simulasi.</div>';}
function documents(c){return `<div class="spread"><div><h3>Kelengkapan paket informasi</h3><p class="muted" style="font-size:10px;margin-top:4px">Checklist desain skenario, bukan daftar syarat berkas perkara resmi.</p></div><div class="doc-count">${docCount(c)}<span class="muted" style="font-size:13px"> / 4</span></div></div><div class="meter"><span style="width:${docCount(c)/4*100}%"></span></div><div class="doc-list">${DOCUMENTS.map(d=>`<div class="doc-row ${c.docs[d.id]?'':'missing'}">${icon(c.docs[d.id]?'check':'warning')}<div>${d.name}<small>${d.purpose}</small></div><span class="pill ${c.docs[d.id]?'green':'amber'}">${c.docs[d.id]?'Tersedia':'Belum tersedia'}</span>${!c.docs[d.id]&&state.role==='djbc'&&!c.closed?`<button class="btn sm" data-action="complete" data-doc="${d.id}" ${!c.started?'disabled title="Mulai simulasi terlebih dahulu"':''}>Lengkapi demo</button>`:''}</div>`).join('')}</div>`;}
function legalReview(c){return `<section class="panel"><div class="panel-head"><div><h3>Telaah prosedural</h3><p>Keputusan manusia · rujukan hukum</p></div>${icon('policy')}</div><div class="panel-pad"><div class="note ${c.legalRequired&&!c.legalReviewed?'amber':''}">${c.legalRequired?(c.legalReviewed?'Telaah skenario telah dicatat oleh peran penelaah. Tidak menerbitkan izin tindakan hukum.':'Memerlukan telaah hukum. Pengiriman administratif ditunda dalam skenario ini sampai pemeriksaan manusia dicatat.'):'Skenario ini tidak meminta telaah tambahan. Ini adalah asumsi desain latihan, bukan pernyataan kewenangan hukum.'}</div><div class="legal-context">${sourceLink('KUHAP','KUHAP 2025 · norma perlu telaah')}${sourceLink('NARKOTIKA','UU Narkotika · rujukan sektoral')}${sourceLink('CUSTOMS','UU Kepabeanan · rujukan mandat')}</div>${c.legalRequired?`<div class="legal-checks">${['Konteks kejadian dan instansi relevan ditinjau.','Norma umum, ketentuan khusus, dan pengecualian dicatat untuk telaah.','Tindak lanjut dirujuk kepada pejabat berwenang, tanpa izin otomatis.'].map((t,i)=>`<label class="check-label"><input type="checkbox" data-legal-check="${i}" ${c.legalChecks[i]?'checked':''} ${state.role!=='legal'||!c.started||c.legalReviewed||c.closed?'disabled':''}>${t}</label>`).join('')}</div>${state.role==='legal'&&!c.legalReviewed?`<div class="section">${actionButton('review','Catat hasil telaah demo',true)}</div>`:!c.legalReviewed?`<p class="muted" style="font-size:10px;margin-top:15px">Ganti peran ke <b>Penelaah Hukum</b> untuk mencatat tiga butir pemeriksaan.</p>`:''}`:''}</div></section>`;}
function nextHint(c){if(!c.started)return 'Mulai skenario untuk mengaktifkan tindakan. Anda dapat mencoba urutan yang tidak tepat untuk melihat feedback.';if(c.closed)return 'Skenario selesai. Ekspor laporan atau reset kasus untuk membandingkan jalur lain.';if(c.legalRequired&&!c.legalReviewed)return 'Periksa checklist, lalu ganti peran ke Penelaah Hukum. Catat tiga butir telaah skenario sebelum pengiriman.';if(c.queued)return c.network==='limited'?'Pulihkan konektivitas skenario melalui pilihan Normal, kemudian tekan Sinkronkan antrean.':'Gunakan peran Pengawasan DJBC dan tekan Sinkronkan antrean.';if(!complete(c))return 'Gunakan peran Pengawasan DJBC untuk melengkapi lampiran sintetis. Paket yang belum lengkap tidak ditandai sebagai serah terima lengkap.';if(!c.checklistViewed)return 'Gunakan peran Pengawasan DJBC untuk memeriksa checklist.';if(!c.sent&&!c.received)return 'Kirim paket dengan peran Pengawasan DJBC. Anda dapat mengubah kondisi jaringan sebelum pengiriman.';if(!c.received)return 'Ganti peran ke Koordinasi Polri untuk memeriksa penerimaan atau meminta klarifikasi.';if(!c.followed)return 'Catat tindak lanjut administratif melalui peran Koordinasi Polri.';return 'Akhiri skenario melalui peran Koordinasi Polri, lalu ekspor laporan proses.';}
function actions(c){let a='';if(!c.started)a=actionButton('start','Mulai simulasi',true);else if(!c.closed){if(state.role==='djbc'){a+=actionButton('check','Periksa checklist');if(!c.sent&&!c.received&&!c.queued)a+=actionButton('submit','Kirim paket demo',true);if(c.queued)a+=actionButton('sync','Sinkronkan antrean',true);a+=actionButton('escalate','Catat kebutuhan eskalasi');}if(state.role==='polri'){a+=actionButton('check','Periksa checklist');if(!c.received)a+=actionButton('receive','Catat penerimaan',true)+actionButton('clarify','Minta klarifikasi');if(c.received&&!c.followed)a+=actionButton('followup','Catat tindak lanjut',true);if(c.followed)a+=actionButton('finish','Akhiri simulasi',true);a+=actionButton('escalate','Catat kebutuhan eskalasi');}if(state.role==='legal')a+=`<div class="note" style="grid-column:1/-1">Gunakan panel Telaah Prosedural untuk mencatat hasil pemeriksaan skenario.</div>`;if(state.role==='audit')a+=actionButton('observe','Catat observasi',true);}

function caseResult(c){if(!c.closed)return '';const blocked=c.events.filter(e=>e.kind==='blocked').length;return `<div class="case-result"><h3>${icon('check')} Simulasi selesai · ${c.id}</h3><p>${SCENARIOS[c.scenario].lesson}</p><div class="result-grid"><div><b>${c.minute}</b><span>menit waktu sintetis</span></div><div><b>${c.events.length-1}</b><span>aktivitas pengguna</span></div><div><b>${blocked}</b><span>tindakan perlu koreksi</span></div></div></div>`;}

/* Deterministic batch model. Shared demand: n cases, d documents and m incomplete first packets.

function computeLab(p){const n=p.n,d=p.docs,m=Math.min(p.missing,n),corrected=Math.min(m,p.precheck),mb=m,mj=m-corrected;const make=(kind,miss,reentry,response,review,audit)=>{const records=Array.from({length:n},(_,i)=>({id:'SYN-'+String(i+1).padStart(2,'0'),model:kind,documentsRequired:d,completeFirst:i>=miss,documentsFirst:i>=miss?d:d-1,clarificationRequired:i<miss,reentryCount:reentry,responseMinutes:response+(i<miss?p.clarify:0),reviewChecked:i<Math.min(review,n),auditExpected:p.steps,auditRecorded:Math.min(audit,p.steps),pendingClarification:i<miss}));return {records,firstPass:records.filter(r=>r.completeFirst).length/n*100,reentry:records.reduce((t,r)=>t+r.reentryCount,0),response:records.reduce((t,r)=>t+r.responseMinutes,0)/n,review:records.filter(r=>r.reviewChecked).length/n*100,audit:records.reduce((t,r)=>t+r.auditRecorded,0)/(n*p.steps)*100,pending:records.filter(r=>r.pendingClarification).length};};return {inputs:{...p,missing: m,precheck:corrected},baseline:make('Baseline',mb,p.reentry,p.response,p.reviewBase,p.auditBase),jalin:make('JALIN',mj,p.jalinReentry,p.jalinResponse,p.reviewJalin,p.auditJalin)};}
const METRICS=[{id:'firstPass',name:'Kelengkapan pengajuan pertama',english:'First-Pass Document Completeness',unit:'%',better:'higher',formula:'pengajuan lengkap pada pemeriksaan pertama / seluruh pengajuan × 100',interpret:'Persentase paket yang memenuhi semua dokumen skenario pada pengajuan pertama.'},{id:'reentry',name:'Pencatatan ulang administratif',english:'Administrative Re-entry Count',unit:'entri',better:'lower',formula:'Σ jumlah pencatatan ulang tiap kasus',interpret:'Jumlah kegiatan memasukkan kembali informasi yang sama dalam model.'},{id:'response',name:'Waktu respons serah terima',english:'Handover Response Time',unit:'menit',better:'lower',formula:'Σ [waktu respons awal + tambahan klarifikasi] / jumlah kasus',interpret:'Rerata waktu sintetis model. Tambahan waktu dikenakan untuk paket yang perlu klarifikasi.'},{id:'review',name:'Cakupan pemeriksaan prosedural',english:'Procedural Review Coverage',unit:'%',better:'higher',formula:'kasus dengan pemeriksaan tercatat / seluruh kasus × 100',interpret:'Ketercakupan pemeriksaan, bukan ukuran sahnya tindakan.'},{id:'audit',name:'Kelengkapan jejak audit',english:'Audit Trail Completeness',unit:'%',better:'higher',formula:'Σ aktivitas tercatat / Σ aktivitas yang diharapkan × 100',interpret:'Ketersediaan catatan aktivitas pada skenario, bukan jaminan integritas produksi.'},{id:'pending',name:'Klarifikasi tertunda',english:'Pending Clarification Count',unit:'kasus',better:'lower',formula:'Σ kasus belum lengkap pada snapshot pengajuan pertama',interpret:'Snapshot awal setelah pengajuan; bukan jumlah kasus yang akhirnya tidak diselesaikan.'}];
function paramField(id,label,min,max,unit,help){const p=state.params;return `<div class="param-field"><div class="param-top"><label for="param-${id}">${label}</label><b id="output-${id}">${num(p[id],0)}<span style="font-size:9px;font-weight:400"> ${unit}</span></b></div><input type="range" id="param-${id}" data-param="${id}" min="${min}" max="${max}" step="1" value="${p[id]}"><div class="range-labels"><span>${min}</span><span>${max}</span></div>${help?`<p class="param-explainer">${help}</p>`:''}</div>`;}
function compareConclusion(r){const n=METRICS.filter(m=>m.better==='higher'?r.jalin[m.id]>r.baseline[m.id]:r.jalin[m.id]<r.baseline[m.id]).length;return `${n} dari 6 indikator bergerak ke arah yang diharapkan pada asumsi saat ini. Hasil dapat setara atau memburuk ketika parameter JALIN diubah; ini bukan estimasi dampak lapangan.`;}
function liveMetrics(){const started=state.cases.filter(c=>c.started),submitted=started.filter(c=>c.firstSubmission!==null),receipts=started.filter(c=>c.received),response=receipts.length?receipts.reduce((s,c)=>s+c.receiveMinute-c.sendMinute,0)/receipts.length:null;return {started:started.length,submitted:submitted.length,firstPass:submitted.length?submitted.filter(c=>c.firstSubmission.complete).length/submitted.length*100:null,pending:started.filter(c=>c.pending).length,response,activities:started.reduce((s,c)=>s+c.events.length-1,0)};}
function policyLabClassic(){const p=state.params,r=computeLab(p),live=liveMetrics();return pageHeading('04 / POLICY & IMPACT LAB','Ubah asumsi. Periksa hasilnya.','Bandingkan dua rancangan proses dengan beban kasus yang sama. Semua nilai batch berasal dari parameter sintetis.',`<button class="btn" data-command="reset-params">${icon('reset')}Reset parameter</button><button class="btn" data-command="export-lab-csv">${icon('download')}CSV</button><button class="btn" data-command="export-lab-json">JSON</button>`)+`<div class="note amber" style="margin-bottom:20px">Baseline adalah asumsi model pembanding, bukan hasil audit Polri/DJBC. Parameter JALIN juga merupakan asumsi; kepercayaan publik dan biaya sosial tidak dihitung oleh model ini.</div><div class="lab-layout"><aside class="panel"><div class="panel-head"><div><h3>Parameter simulasi</h3><p>Nilai dapat diubah dan direproduksi.</p></div></div><div class="panel-pad"><div class="eyebrow muted" style="margin-bottom:18px">BEBAN KASUS BERSAMA</div><div class="params-grid">${paramField('n','Jumlah kasus',1,30,'kasus')}${paramField('docs','Dokumen wajib per kasus',2,8,'dok.')}${paramField('missing','Paket awal belum lengkap',0,p.n,'kasus','Satu dokumen tidak tersedia pada tiap paket ini.')}${paramField('clarify','Tambahan waktu klarifikasi',0,60,'menit')}${paramField('steps','Aktivitas yang diharapkan',4,12,'tahap')}</div><div class="param-legend"><span class="swatch"></span><b>Asumsi Baseline</b></div><div class="params-grid">${paramField('reentry','Pencatatan ulang per kasus',0,5,'entri')}${paramField('response','Respons awal',1,90,'menit')}${paramField('reviewBase','Kasus diperiksa',0,p.n,'kasus')}${paramField('auditBase','Catatan per kasus',0,p.steps,'tahap')}</div><div class="param-legend section"><span class="swatch jalin"></span><b>Asumsi JALIN</b></div><div class="params-grid">${paramField('precheck','Paket diperbaiki sebelum kirim',0,Math.min(p.missing,p.n),'kasus','Asumsi pemeriksaan awal; bukan tingkat efektivitas terukur.')}${paramField('jalinReentry','Pencatatan ulang per kasus',0,5,'entri')}${paramField('jalinResponse','Respons awal',1,90,'menit')}${paramField('reviewJalin','Kasus diperiksa',0,p.n,'kasus')}${paramField('auditJalin','Catatan per kasus',0,p.steps,'tahap')}</div></div></aside><div class="stack"><section class="panel"><div class="panel-head"><div><h2>Perbandingan proses</h2><p id="labSummary">${p.n} kasus · ${p.docs} dokumen wajib · snapshot pengajuan pertama</p></div><div class="flex wrap" style="font-size:9px"><span class="flex"><i class="swatch"></i>Baseline</span><span class="flex"><i class="swatch jalin"></i>JALIN</span></div></div><div id="metricChart">${metricChart(r)}</div><div class="compare-callout" id="compareConclusion">${compareConclusion(r)}</div></section><section class="panel"><div class="panel-head"><div><h2>Hasil sesi CaseLab Anda</h2><p>State interaksi aktual pada perangkat ini · terpisah dari model batch di atas</p></div></div><div class="panel-pad"><div class="live-eval"><div><b>${live.firstPass===null?'—':num(live.firstPass)+'%'}</b><p>Pengajuan pertama lengkap</p><small>${live.submitted} kasus diajukan</small></div><div><b>${live.pending}</b><p>Klarifikasi tertunda</p><small>${live.started} simulasi dimulai</small></div><div><b>${live.response===null?'—':num(live.response)}</b><p>Rerata respons (menit)</p><small>${state.cases.filter(c=>c.received).length} penerimaan</small></div></div><p class="muted" style="font-size:10px;margin-top:14px">Tanda — berarti belum ada pengamatan yang sesuai. Ekspor JSON menyertakan data batch dan ringkasan sesi CaseLab tanpa mencampur keduanya.</p></div></section></div></div>
 <section class="panel section"><div class="panel-head"><div><h2>Rumus, input, dan batas interpretasi</h2><p>Grafik dapat direproduksi dari baris data sintetis pada ekspor.</p></div></div><div class="table-wrap"><table><thead><tr><th>Indikator</th><th>Rumus & satuan</th><th>Input dan interpretasi</th></tr></thead><tbody>${METRICS.map(m=>`<tr><td><strong>${m.name}</strong><p class="muted">${m.english}</p></td><td><div class="formula">${m.formula}</div><span class="muted">Satuan: ${m.unit}</span></td><td>${m.interpret}</td></tr>`).join('')}</tbody></table></div></section><details class="method-details"><summary>Bagaimana model menghasilkan setiap baris data?</summary><div><p>Kasus diberi ID SYN-01 hingga SYN-N tanpa pengacakan. Pada Baseline, M kasus pertama kehilangan satu dari D dokumen. Pada JALIN, C paket dari kelompok yang sama diperbaiki sebelum pengajuan sehingga tersisa M−C kasus belum lengkap. Kasus, kebutuhan dokumen, serta tambahan waktu klarifikasi sama pada kedua model.</p><div class="formula">Kelengkapan Baseline = (N−M)/N × 100<br>Kelengkapan JALIN = [N−(M−C)]/N × 100<br>Respons = R + (kasus perlu klarifikasi / N) × K</div><p>Waktu respons dihitung sejak pengajuan; durasi pemeriksaan dan perbaikan sebelum kirim tidak masuk metrik ini. Model tidak menghitung total durasi penanganan. Respons awal, pencatatan ulang, jumlah kasus diperiksa, dan aktivitas tercatat ditentukan pengguna untuk masing-masing model. Hasil tidak menjamin JALIN lebih baik. Untuk mengisolasi efek satu asumsi, samakan parameter lain. Semua input ditampilkan dan diekspor; batas parameter mencegah persentase di luar 0–100%.</p></div></details><div class="grid-2 section"><div class="note"><b>Manfaat proses yang bisa diuji</b><br>Kelengkapan paket, respons koordinasi, pekerjaan berulang, dan keterlacakan penanggung jawab memerlukan baseline operasional yang dikumpulkan secara sah.</div><div class="note"><b>Dampak kebijakan yang perlu pengukuran terpisah</b><br>Kepercayaan publik serta pengurangan biaya sosial narkotika memerlukan desain evaluasi dan data tambahan setelah penerapan.</div></div>`;}
function renderLabOutputsClassic(){const r=computeLab(state.params);document.getElementById('metricChart').innerHTML=metricChart(r);document.getElementById('compareConclusion').textContent=compareConclusion(r);document.getElementById('labSummary').textContent=`${state.params.n} kasus · ${state.params.docs} dokumen wajib · snapshot pengajuan pertama`;for(const [id,v]of Object.entries(state.params)){const inp=document.getElementById('param-'+id),out=document.getElementById('output-'+id);if(inp){inp.value=v;if(['missing','reviewBase','reviewJalin'].includes(id))inp.max=state.params.n;if(id==='precheck')inp.max=Math.min(state.params.missing,state.params.n);if(['auditBase','auditJalin'].includes(id))inp.max=state.params.steps;}if(out)out.firstChild.textContent=num(v,0);if(inp){const labels=inp.parentElement.querySelector('.range-labels');if(labels)labels.lastElementChild.textContent=inp.max;}}}
function setParam(id,value){if(!(id in DEFAULT_PARAMS))return;const p=state.params;const bounds={n:[1,30],docs:[2,8],missing:[0,p.n],reentry:[0,5],response:[1,90],clarify:[0,60],steps:[4,12],precheck:[0,Math.min(p.missing,p.n)],jalinReentry:[0,5],jalinResponse:[1,90],reviewBase:[0,p.n],reviewJalin:[0,p.n],auditBase:[0,p.steps],auditJalin:[0,p.steps]};const [min,max]=bounds[id];p[id]=Math.min(max,Math.max(min,Math.round(Number(value)||min)));p.missing=Math.min(p.missing,p.n);p.precheck=Math.min(p.precheck,p.missing);p.reviewBase=Math.min(p.reviewBase,p.n);p.reviewJalin=Math.min(p.reviewJalin,p.n);p.auditBase=Math.min(p.auditBase,p.steps);p.auditJalin=Math.min(p.auditJalin,p.steps);save();renderLabOutputs();}

function boardMarkup(){const groups=[{name:'Persiapan & peninjauan',states:['NEW','CHECK','LEGAL','CLARIFY','READY','QUEUE']},{name:'Koordinasi & penerimaan',states:['SENT','RECEIVED']},{name:'Tindak lanjut',states:['FOLLOWUP','CLOSED']}],cases=filteredCases();return groups.map(g=>{const group=cases.filter(c=>g.states.includes(c.status));return `<section class="board-column"><div class="board-column-head"><span>${g.name}</span><b>${group.length}</b></div><div class="board-cards">${group.length?group.map(c=>`<article class="board-card"><button class="board-open" data-open-case="${c.id}"><div class="spread"><span class="mono">${c.id}</span><span class="muted">↗</span></div><h3>${c.title}</h3><div class="board-art">${scenarioArtwork(c.scenario)}<div>${statusPill(c)}<span style="display:block;margin-top:6px">${docCount(c)}/4 dokumen · T+${c.minute} min</span></div></div></button><div class="board-card-foot"><span class="flex"><span class="avatar">${ROLES[c.owner].initial}</span>${ROLES[c.owner].short}</span><span>${c.events.length-1} aktivitas</span></div></article>`).join(''):'<div class="board-empty">Belum ada kasus pada tahap ini.</div>'}</div></section>`;}).join('');}
function jointDesk(){const c=activeCase(),f=ui.filters;const stats=[['case',state.cases.length,'Kasus sintetis'],['clock',state.cases.filter(x=>x.started).length,'Simulasi dimulai'],['warning',state.cases.filter(x=>x.pending||x.started&&x.legalRequired&&!x.legalReviewed).length,'Perlu tindak lanjut'],['check',state.cases.filter(x=>x.received).length,'Penerimaan tercatat']];return pageHeading('03 / JOINT CASE DESK','Lihat siapa yang perlu menindaklanjuti.','Buka kartu untuk dokumen, koordinasi, atau jejak audit. Perubahan CaseLab tampil pada papan yang sama.',`<button class="btn" data-feature="roles">${icon('user')}${ROLES[state.role].short}</button><button class="btn" data-command="export-all">${icon('download')}Ekspor</button>`)+`<div class="board-summary">${stats.map(([ic,n,label])=>`<div class="board-stat"><span class="stat-icon">${icon(ic)}</span><div><b>${n}</b><small>${label}</small></div></div>`).join('')}</div><section class="panel"><div class="filter-bar no-print"><div class="form-field"><label for="deskSearch">Cari referensi atau skenario</label><input id="deskSearch" type="search" placeholder="Mis. DEM-JP-001 atau Kargo" data-filter="query" value="${esc(f.query)}"></div><div class="form-field"><label for="statusFilter">Status</label><select id="statusFilter" data-filter="status"><option value="all">Semua status</option>${Object.entries(STATUS).map(([id,[s]])=>`<option value="${id}" ${id===f.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-field"><label for="scenarioFilter">Skenario</label><select id="scenarioFilter" data-filter="scenario"><option value="all">Semua skenario</option>${Object.entries(SCENARIOS).map(([id,s])=>`<option value="${id}" ${id===f.scenario?'selected':''}>${id} · ${s.name}</option>`).join('')}</select></div><div class="form-field"><label for="ownerFilter">Pemilik tugas</label><select id="ownerFilter" data-filter="owner"><option value="all">Semua pemilik tugas</option>${Object.entries(ROLES).map(([id,r])= function presetModel(name){const p=state.params;if(name==='equal'){p.precheck=0;p.jalinReentry=p.reentry;p.jalinResponse=p.response;p.reviewJalin=p.reviewBase;p.auditJalin=p.auditBase;}else if(name==='precheck'){state.params={...DEFAULT_PARAMS};}else if(name==='burden'){p.precheck=0;p.jalinReentry=Math.min(p.reentry+2,5);p.jalinResponse=Math.min(p.response+15,90);p.reviewJalin=p.reviewBase;p.auditJalin=p.auditBase;}else return;save();render();toast(name==='equal'?'Dua model kini memakai asumsi yang setara.':name==='precheck'?'Asumsi pemeriksaan awal dimuat. Seluruh parameter tetap dapat diubah.':'Asumsi beban tambahan dimuat; hasil JALIN dapat memburuk.');}

function openRisk(i){const r=RISKS[i];if(!r)return;modal(popupShell(r[0],'RISK REGISTER · RANCANGAN PENULIS',`<dl class="popup-fields"><dt>Konsekuensi</dt><dd>${r[1]}</dd><dt>Mitigasi</dt><dd>${r[2]}</dd><dt>Pemilik usulan</dt><dd>${r[3]}</dd><dt>Pemicu tinjauan</dt><dd>${r[4]}</dd></dl>`),popupFooter());}
function command(id){const dialog=document.getElementById('modal');if(id==='help')return openFeature('journey');if(id.startsWith('role-')){const role=id.slice(5);if(!ROLES[role])return;dialog.close();ui.modalKind=null;changeRole(role);if(ui.module==='overview'||ui.module==='policy')navigate('case');return;}if(id==='close-modal')ui.modalKind=null;return performCommand(id);}
function updateChromeV2(){const c=activeCase();const role=document.getElementById('sideRole');if(role)role.innerHTML=`<small>PERAN DEMONSTRASI</small><div class="flex" style="margin-top:9px"><span class="avatar">${ROLES[state.role].initial}</span><p>${ROLES[state.role].short}</p></div><button data-feature="roles">Ganti peran ↗</button>`;const header=document.getElementById('headerCase');if(header)header.innerHTML=`<span class="dot"></span><b>${c.id}</b><span>${docCount(c)}/4 dok.</span>`;const dock=document.getElementById('featureDock');if(dock)dock.innerHTML=`<button class="dock-btn" data-open-audit="true" title="Buka jejak kasus aktif">${icon('audit')}<span class="dock-text">Jejak simulasi</span><span>${c.events.length-1}</span></button>`;}
function render(){renderClassic();updateChrome();}

function recipientArt(){return `<svg viewBox="0 0 150 100" role="img" aria-label="Petugas penerima dan paket informasi fiktif"><ellipse cx="75" cy="91" rx="51" ry="4" fill="#a8c8ec" opacity=".4"/><circle cx="57" cy="30" r="14" fill="#a8c8ec" stroke="#6b9fd8"/><path d="M44 28c0-20 26-20 26 0" fill="#2558a0"/><path d="M34 81V61c0-20 48-20 48 0v20" fill="#3b74c8" stroke="#2558a0"/><path d="M52 46l5 13 5-13" fill="#fff"/><rect x="82" y="36" width="37" height="48" rx="4" fill="#fff" stroke="#6b9fd8"/><path d="M89 47h23M89 55h23M89 63h14" stroke="#a8c8ec" stroke-width="2"/><circle cx="115" cy="80" r="11" fill="#2558a0"/><path d="M110 80l4 4 7-8" stroke="#fff" stroke-width="1.6" fill="none"/></svg>`;}
function paperStack(c){return `<div class="paper-stack" aria-label="${docCount(c)} dari 4 dokumen tersedia"><span class="paper"><i></i><i></i><i></i><b>✓</b></span><span class="paper"><i></i><i></i><b>✓</b></span><span class="paper ${complete(c)?'':'missing'}"><i></i><i></i><b>${complete(c)?'✓':'!'}</b></span></div>`;}
function transferLanes(c,live=false){return `<div class="transfer-lanes"><div class="transfer-lane"><span class="lane-step">01 / PENGIRIM</span><div class="lane-art">${scenarioArtwork('A')}</div><h3>Pengawasan DJBC</h3><p>${c.started?'Temuan tercatat':'Menyiapkan temuan'}</p>${live?'':`<button class="btn sm" data-feature="finding">Buka temuan ↗</button>`}</div><div class="transfer-arrow ${c.sent&&!c.received?'sent':''}">→</div><div class="transfer-lane central"><span class="lane-step">02 / KOORDINASI</span><div class="lane-art">${paperStack(c)}</div><h3>Paket informasi</h3><p>${docCount(c)}/4 dokumen tersedia</p>${live?'':`<button class="btn sm" data-feature="package">Periksa paket ↗</button>`}</div><div class="transfer-arrow ${c.sent&&!c.received?'sent':''}">→</div><div class="transfer-lane"><span class="lane-step">03 / PENERIMA</span><div class="lane-art">${recipientArt()}</div><h3>Koordinasi Polri</h3><p>${c.received?'Penerimaan tercatat':c.sent?'Menunggu penerimaan':'Menunggu pengiriman'}</p>${live?'':`<button class="btn sm" data-feature="recipient">Buka koordinasi ↗</button>`}</div></div>`;}
function overview(){const c=activeCase(),live=liveMetrics();return `<div class="desk-banner"><div><div class="eyebrow">JEJAK AKUNTABILITAS LINTAS INSTANSI</div><h1>Koordinasi terlihat. Tindak lanjut terlacak.</h1><p>Eksplorasi satu paket informasi dari pengawasan hingga penerimaan.</p></div><button class="btn primary" data-live-open="true">${icon('case')}Uji fitur bersama ${icon('arrow')}</button></div><section class="workbench"><div class="workbench-head"><div><h2>Ruang koordinasi visual</h2><p>PROTOTIPE RISET · POLRI–DJBC · SELURUH KASUS FIKTIF</p></div>${statusPill(c)}</div><div class="workbench-body"><div class="transfer-canvas"><div class="transfer-top"><span class="live-tag"><span class="dot"></span>${c.id} · Skenario ${c.scenario}</span><span>T+${c.minute} menit sintetis</span></div>${transferLanes(c)}<div class="transfer-caption"><span>Klik objek untuk membuka fitur dan data yang terkait.</span><span class="pill">${SCENARIOS[c.scenario].name}</span></div></div><aside class="bench-side"><div class="eyebrow">TANGGUNG JAWAB SAAT INI</div><div class="assignee"><span class="avatar">${ROLES[c.owner].initial}</span><div><h3>${ROLES[c.owner].short}</h3><p>Pemilik tugas</p></div></div><div class="bench-rules">${gateRequirements(c).slice(0,3).map(g=>`<div class="bench-rule ${g.done?'':'missing'}">${icon(g.done?'check':'warning')}${g.name}</div>`).join('')}</div><button class="btn primary" data-live-open="true">Jalankan koordinasi ${icon('arrow')}</button><button class="btn sm" data-feature="roles">${icon('user')}Ganti peran simulasi</button></aside></div><div class="bench-bottom"><button data-feature="package"><b>${docCount(c)}/4</b><small>Dokumen paket aktif ↗</small></button><button data-open-audit="true"><b>${c.events.length-1}</b><small>Aktivitas pengguna ↗</small></button><button data-nav="desk"><b>${state.cases.filter(x=>x.received).length}</b><small>Penerimaan pada sesi ini ↗</small></button><button data-nav="lab"><b>${live.firstPass===null?'—':num(live.firstPass)+'%'}</b><small>Pengajuan pertama lengkap · sesi ↗</small></button></div></section><section class="section"><div class="section-title"><div><h2>Fitur yang bekerja pada data yang sama</h2><p>Pratinjau, koordinasi, jejak, dan evaluasi dapat ditelusuri langsung.</p></div><button class="btn sm" data-v3-welcome="true">Jelajahi fitur ↗</button></div><div class="feature-studio">${[['package','Paket & kelengkapan','Buka dokumen, identifikasi kekurangan, dan lengkapi demo.',0],['roles','Peran & penerimaan','Coba tugas pengirim, penerima, penelaah, dan pengawas.',1],['audit','Jejak & pertanggungjawaban','Lihat pelaksana, waktu sintetis, dan perubahan status.',2],['metric-firstPass','Evaluasi & asumsi','Inspeksi rumus dan record pembanding yang dapat diubah.',2]].map(([key,title,desc,art])=>`<button data-feature="${key}"><span class="feature-art">${pillarArtwork(art)}<span>↗</span></span><div class="feature-copy"><h3>${title}</h3><p>${desc}</p><span class="feature-cta">Buka fitur ↗</span></div></button>`).join('')}</div></section><div class="v-pillars">${PILLARS.map((p,i)=>`<button class="v-pillar" data-feature="pillar-${i}">${pillarArtwork(i)}<div><div class="eyebrow">PILAR 0${i+1}</div><h3>${p.name}</h3><p>${p.short}</p></div><span class="more">↗</span></button>`).join('')}</div><div class="v3-context"><div><div class="eyebrow">KONTEKS EMPIRIS</div><span class="muted" style="font-size:9px">Terpisah dari indikator simulasi.</span></div><div class="context-values"><button data-source="BNN25"><b>2,11%</b><small>Prevalensi 2025 ↗</small></button><button data-source="EMP21"><b>42,3%</b><small>Responden studi E-MP 2021 ↗</small></button><button data-source="EMP26"><b>14.547</b><small>Personel · studi 2026 ↗</small></button></div></div>`;}
function visualDocuments(c){return `<div class="v-doc-row-title"><div><h3>Paket informasi</h3><p class="muted">Klik berkas untuk pratinjau atau pelengkapan.</p></div><div class="doc-count">${docCount(c)}<span class="muted" style="font-size:11px"> / 4</span></div></div><div class="v-doc-progress">${DOCUMENTS.map(d=>`<span class="${c.docs[d.id]?'done':''}"></span>`).join('')}</div><div class="v-docs">${DOCUMENTS.map(d=>`<button class="v-doc doc-tile-v3 ${c.docs[d.id]?'':'missing'}" data-document="${d.id}" aria-label="${d.name}: ${c.docs[d.id]?'tersedia':'belum tersedia'}"><span class="doc-art">${icon('file')}</span><span class="doc-mark">${c.docs[d.id]?'✓ tersedia':'! diperlukan'}</span><h4>${d.name}</h4><p>${c.docs[d.id]?'Buka pratinjau ↗':'Lihat kebutuhan pelengkapan ↗'}</p></button>`).join('')}</div>`;}
function liveButtons(c){const button=(a,t,primary=false,doc='')=>`<button class="btn ${primary?'primary':''}" data-live-action="${a}" ${doc?`data-live-doc="${doc}"`:''}>${icon(a==='submit'?'send':a==='start'?'arrow':'check')}${t}</button>`;if(!c.started)return button('start','Mulai simulasi',true);if(c.closed)return `<button class="btn primary" data-command="export-case">${icon('download')}Ekspor hasil kasus</button><button class="btn" data-command="reset-case">${icon('reset')}Reset kasus aktif</button>`;let html='';if(state.role==='djbc'){html+=button('check','Periksa checklist');if(!complete(c)&&!c.sent)html+=button('complete','Lengkapi lampiran',false,'attachment');if(!c.sent&&!c.queued&&!c.received)html+=button('submit','Kirim paket demo',true);if(c.queued)html+=button('sync','Sinkronkan antrean',true);}else if(state.role==='polri'){if(!c.received)html+=button('receive','Catat penerimaan',true)+button('clarify','Minta klarifikasi');if(c.received&&!c.followed)html+=button('followup','Catat tindak lanjut',true);if(c.followed)html+=button('finish','Akhiri simulasi',true);}else if(state.role==='audit')html+=button('observe','Catat observasi',true);else html+=`<button class="btn primary" data-command="close-modal" data-modal-nav="case">${icon('policy')}Telaah di CaseLab</button>`;if(!html)html=`<button class="btn primary" data-live-role="polri">Beralih ke Koordinasi Polri</button>`;return html;}
function openLiveLab(){ui.liveOpen=true;ui.modalKind='live';const c=activeCase(),event=c.events.at(-1),live=liveMetrics();const feedback=event.action==='seed'?`<div class="live-feedback"><b>Mulai dari kasus aktif.</b>Pilih peran dan tindakan. Setiap perubahan memakai data CaseLab yang sama.</div>`:`<div class="live-feedback ${event.kind==='blocked'?'warn':''}"><b>${esc(event.title)}</b>${esc(event.detail)}<br><span style="font-size:9px">${STATUS[event.before]?.[0]} → ${STATUS[event.after]?.[0]} · ${ROLES[event.role]?.short||'Master skenario'}</span></div>`;const top=`<div class="popup-top"><div><div class="eyebrow">DEMONSTRASI FITUR TERPADU · ${c.id}</div><h2>Jalankan satu koordinasi.</h2><p>Semua tindakan memakai kasus aktif · waktu dan dokumen sintetis.</p></div><button class="popup-close" data-command="close-modal" aria-label="Tutup demonstrasi">×</button></div>`;const body=`<div class="live-lab"><div class="role-strip">${Object.entries(ROLES).map(([id,r])=>`<button class="role-chip ${state.role===id?'active':''}" data-live-role="${id}"><span class="avatar">${r.initial}</span>${r.short}</button>`).join('')}</div><div class="transfer-canvas"><div class="transfer-top">${statusPill(c)}<span class="mono">T+${c.minute} min</span></div>${transferLanes(c,true)}</div><div class="live-controls"><section class="live-control-panel"><h3>Tindakan · ${ROLES[state.role].short}</h3><div class="live-action-grid">${liveButtons(c)}</div>${feedback}<div class="no-role-warning">${nextHint(c)}</div>${c.network==='limited'||c.queued?`<button class="btn sm section" data-live-network="${c.network==='limited'?'online':'limited'}">${icon('network')}${c.network==='limited'?'Pulihkan koneksi demo':'Batasi koneksi demo'}</button>`:''}</section><section class="live-control-panel"><div class="spread" style="margin-bottom:12px"><h3 style="margin:0">Jejak lintas peran</h3><span class="pill">${c.events.length-1} aktivitas</span></div>${timeline({events:c.events.slice(-4)})}</section></div><div class="live-live-kpis"><button data-feature="package"><b>${docCount(c)}/4</b><small>Kelengkapan kasus aktif ↗</small></button><button data-nav="desk"><b>${ROLES[c.owner].initial}</b><small>Pemilik tugas: ${ROLES[c.owner].short} ↗</small></button><button data-nav="lab"><b>${live.firstPass===null?'—':num(live.firstPass)+'%'}</b><small>Pengajuan pertama lengkap · sesi ↗</small></button></div></div>`;modal(top+body,popupFooter(`<button class="btn" data-command="close-modal" data-modal-nav="desk">Lihat pada papan kasus</button><button class="btn primary" data-command="close-modal" data-modal-nav="case">Lanjutkan di CaseLab</button>`),'lab');}
function liveAction(action,doc){const result=performAction(action,doc);openLiveLab();return result;}
function liveRole(role){if(!ROLES[role])return;changeRole(role);openLiveLab();}
function openWelcome(){ui.modalKind='welcome';const c=activeCase();const items=[['package','Dokumen & kelengkapan','Pratinjau dan kebutuhan pelengkapan.','file'],['roles','Pergantian peran','Tanggung jawab pengirim dan penerima.','user'],['audit','Jejak perubahan','Pelaksana, waktu, dan tindak lanjut.','audit'],['metric-firstPass','Evaluasi proses','Rumus, input, dan record pembanding.','lab']];modal(popupShell('Lihat fitur bekerja bersama.','JALIN PRESISI · INTERACTIVE COORDINATION LAB',`<div class="welcome-grid"><div class="welcome-diagram">${scenarioArtwork(c.scenario)}<h3>Satu paket informasi.</h3><p>Dokumen → koordinasi → jejak → evaluasi.</p><div class="popup-status" style="justify-content:center">${statusPill(c)}</div></div><div class="welcome-options">${items.map(([key,title,desc,ic])=>`<button class="welcome-option" data-feature="${key}"><span class="pillar-icon">${icon(ic)}</span><span><h3>${title} ↗</h3><p>${desc}</p></span></button>`).join('')}</div></div><p class="welcome-note">Prototipe riset independen. Seluruh perkara fiktif; bukan sistem resmi Polri atau DJBC.</p>`),`<button class="btn" data-welcome-dismiss="true">Jelajahi dashboard</button><button class="btn primary" data-welcome-demo="true">Coba demonstrasi terpadu ${icon('arrow')}</button>`);}
function dismissWelcome(){try{localStorage.setItem('jalin-v3-intro','seen');}catch{}document.getElementById('modal').close();ui.modalKind=null;}
function updateChrome(){updateChromeV2();const dock=document.getElementById('featureDock');if(dock)dock.innerHTML=`<button class="dock-btn launch-btn" data-live-open="true" title="Buka demonstrasi lintas modul">${icon('case')}<span class="dock-text">Uji fitur bersama</span></button>`+dock.innerHTML;}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;let handled=true;if(el.dataset.liveOpen)openLiveLab();else if(el.dataset.liveAction)liveAction(el.dataset.liveAction,el.dataset.liveDoc);else if(el.dataset.liveRole)liveRole(el.dataset.liveRole);else if(el.dataset.liveNetwork){switchNetwork(el.dataset.liveNetwork);openLiveLab();}else if(el.dataset.v3Welcome)openWelcome();else if(el.dataset.welcomeDismiss)dismissWelcome();else if(el.dataset.welcomeDemo){dismissWelcome();openLiveLab();}else handled=false;if(handled){e.preventDefault();e.stopImmediatePropagation();}},true);
setTimeout(()=>{try{if(ui.module==='overview'&&!localStorage.getItem('jalin-v3-intro'))openWelcome();}catch{}},350);

document.addEventListener('click',e=>{
 const el=e.target.closest('button,[data-case],[data-feature],[data-stage]');if(!el||el.disabled)return;
 if(el.dataset.modalNav){document.getElementById('modal').close();ui.modalKind=null;return navigate(el.dataset.modalNav);}
 if(el.dataset.document)return openDocument(el.dataset.document);
 if(el.dataset.feature)return openFeature(el.dataset.feature);
 if(el.dataset.stage!==undefined)return openStage(Number(el.dataset.stage));
 if(el.dataset.scene){ui.scene=el.dataset.scene;render();return;}
 if(el.dataset.openCase)return openCaseDrawer(el.dataset.openCase);
 if(el.dataset.openAudit)return openCaseDrawer(state.activeCase,'audit');
 if(el.dataset.packetTab)return openCaseDrawer(state.activeCase,el.dataset.packetTab);
 if(el.dataset.scenarioPreview)return openScenario(el.dataset.scenarioPreview);
 if(el.dataset.launchCase){document.getElementById('modal').close();ui.modalKind=null;state.activeCase=el.dataset.launchCase;save();navigate('case');return;}
 if(el.dataset.role){changeRole(el.dataset.role);return;}
 if(el.dataset.view){ui.board=el.dataset.view==='board';render();return;}
 if(el.dataset.preset)return presetModel(el.dataset.preset);
 if(el.dataset.batchKind)return openBatchRow(el.dataset.batchKind,Number(el.dataset.batchRow));
 if(el.dataset.source)return openSource(el.dataset.source);
 if(el.dataset.roadmap!==undefined)return openRoadmap(Number(el.dataset.roadmap));
 if(el.dataset.risk!==undefined)return openRisk(Number(el.dataset.risk));
 if(el.dataset.command)return command(el.dataset.command);
 if(el.dataset.action)return execute(el.dataset.action,el.dataset.doc);
 if(el.dataset.caseSelect){state.activeCase=el.dataset.caseSelect;save();}
 if(el.dataset.pillar!==undefined){ui.pillar=Number(el.dataset.pillar);if(!el.dataset.nav){render();return;}}
 if(el.dataset.nav){const modal=document.getElementById('modal');if(modal.open)modal.close();ui.modalKind=null;return navigate(el.dataset.nav);}
 if(el.dataset.caseSelect)return selectCase(el.dataset.caseSelect);
 if(el.dataset.case)return openCaseDrawer(el.dataset.case);
 if(el.dataset.deskTab){ui.deskTab=el.dataset.deskTab;render();return;}
 if(el.dataset.gov){ui.gov=el.dataset.gov;render();}
});
document.addEventListener('change',e=>{
 const el=e.target;if(el.dataset.control==='role'){const drawer=ui.modalKind==='case';changeRole(el.value);if(drawer)openCaseDrawer(state.activeCase,ui.packetTab);return;}
 if(el.dataset.control==='case')return selectCase(el.value);
 if(el.dataset.control==='network')return switchNetwork(el.value);
 if(el.dataset.legalCheck!==undefined){const c=activeCase();if(state.role!=='legal'||!c.started||c.closed||c.legalReviewed)return;const i=Number(el.dataset.legalCheck);if(i<0||i>2)return;c.legalChecks[i]=el.checked;pushEvent(c,'legal-check','Butir telaah skenario diperbarui','Butir '+(i+1)+': '+(el.checked?'ditandai telah ditinjau.':'ditandai perlu ditinjau kembali.'),1,'info');save();render();return;}
 if(el.dataset.control==='sourceFilter'){ui.sourceFilter=el.value;document.getElementById('sourceRows').innerHTML=['legal','data'].includes(ui.gov)?referenceRows(el.value):sourceTiles(el.value);}
 if(el.dataset.filter){ui.filters[el.dataset.filter]=el.value;refreshDesk();}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.param)return setParam(el.dataset.param,el.value);if(el.dataset.filter==='query'){ui.filters.query=el.value;refreshDesk();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-feature],svg [data-stage]')){e.preventDefault();if(e.target.dataset.feature)openFeature(e.target.dataset.feature);else openStage(Number(e.target.dataset.stage));}});

document.getElementById('navOpen').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('veil').classList.add('open');document.getElementById('navOpen').setAttribute('aria-expanded','true');});document.getElementById('navClose').addEventListener('click',closeNav);document.getElementById('veil').addEventListener('click',closeNav);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});window.addEventListener('popstate',()=>navigate(location.hash.slice(1),false));window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==ui.module)navigate(location.hash.slice(1),false);});
// Exported pure model supports reproducible QA without importing any government data.
window.JalinModel={computeLab,definitions:METRICS,defaultParams:{...DEFAULT_PARAMS},version:VERSION};
navigate(location.hash.slice(1)||'overview',false);


</script>
</body>
</html>
